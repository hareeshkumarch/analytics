name: Evaluation
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id to route every role to (blank keeps the default routing)
        required: false
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    paths:
      - backend/app/application/prompts.py
      - backend/app/application/services/**
      - backend/app/adapters/orchestration/**
      - backend/app/adapters/providers/**
      - backend/app/adapters/query/**
      - backend/app/evaluation/**
      - backend/config/**
      - .github/workflows/eval.yml

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPDATES_BASELINE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Skip without a provider key
        id: keys
        run: |
          if [ -z "$OPENAI_API_KEY$ANTHROPIC_API_KEY$GEMINI_API_KEY" ]; then
            echo "::notice::No provider API key secret is set; skipping the evaluation."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - if: steps.keys.outputs.run == 'true'
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock && python -m pip install --no-deps -e backend
      - name: Restore the last passing baseline
        if: steps.keys.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: backend/eval/baselines
          key: eval-baseline-${{ inputs.model || 'default' }}-${{ github.run_id }}
          restore-keys: eval-baseline-${{ inputs.model || 'default' }}-
      - name: Run the corpus
        if: steps.keys.outputs.run == 'true'
        env:
          MODEL: ${{ inputs.model }}
        run: |
          if [ "$UPDATES_BASELINE" = "true" ]; then UPDATE="--update-baseline"; else UPDATE=""; fi
          make eval EVAL_ARGS="$UPDATE ${MODEL:+--model $MODEL}"
      - name: Report in the job summary
        if: always() && steps.keys.outputs.run == 'true'
        run: cat backend/eval/reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report was written." >> "$GITHUB_STEP_SUMMARY"
      - name: Save the baseline
        if: success() && steps.keys.outputs.run == 'true' && env.UPDATES_BASELINE == 'true'
        uses: actions/cache/save@v4
        with:
          path: backend/eval/baselines
          key: eval-baseline-${{ inputs.model || 'default' }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.run == 'true'
        with:
          name: eval-report
          path: backend/eval/reports
