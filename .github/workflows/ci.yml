name: CI
on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tracked files must not match an ignore rule
        run: |
          matches="$(git ls-files -z | git check-ignore --no-index -z --stdin | tr '\0' '\n')"
          if [ -n "$matches" ]; then
            echo "::error::.gitignore rules match committed files; new files at these paths would be silently skipped:"
            echo "$matches"
            exit 1
          fi
      - name: Lock files are present
        run: test -f frontend/package-lock.json && test -f backend/requirements.lock && test -f backend/requirements-dev.lock

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ledgerline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m pip check
      - run: cd backend && ruff check app tests
      - name: Migrations apply, roll back and re-apply on PostgreSQL
        run: cd backend && export DATABASE_URL="$TEST_POSTGRES_URL" && alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: cd backend && pytest -v
      - run: cd backend && mypy app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Generated API types match openapi.json
        run: cd frontend && npm run gen:api && git diff --exit-code src/lib/api/schema.ts
      - run: cd frontend && npm run typecheck && npm run lint && npm run test:unit && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test --trace off
