name: CI
on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tracked files must not match an ignore rule
        run: |
          matches="$(git ls-files -z | git check-ignore --no-index -z --stdin | tr '\0' '\n')"
          if [ -n "$matches" ]; then
            echo "::error::.gitignore rules match committed files; new files at these paths would be silently skipped:"
            echo "$matches"
            exit 1
          fi
      - name: Lock files are present
        run: test -f frontend/package-lock.json && test -f backend/requirements.lock && test -f backend/requirements-dev.lock

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m pip check
      - run: cd backend && ruff check app tests
      - run: cd backend && pytest -v
      - name: mypy (advisory until existing type errors are fixed)
        continue-on-error: true
        run: cd backend && mypy app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run typecheck && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test --trace off
