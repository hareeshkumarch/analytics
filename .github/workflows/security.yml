name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: "43 3 * * 1"

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install scanners
        run: python -m pip install pip-audit==2.10.1 cyclonedx-bom==9.0.0
      - name: Audit backend dependencies
        run: |
          pip-audit -r backend/requirements.lock --disable-pip --no-deps
          pip-audit -r backend/requirements-dev.lock --disable-pip --no-deps
      - name: Audit frontend production dependencies
        run: cd frontend && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
      - name: Generate SBOMs
        if: always()
        run: |
          mkdir -p sbom
          cyclonedx-py requirements backend/requirements.lock --of JSON -o sbom/backend.cdx.json
          (cd frontend && npm sbom --sbom-format cyclonedx --omit dev > ../sbom/frontend.cdx.json)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom
