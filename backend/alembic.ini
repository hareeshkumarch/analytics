[alembic]
script_location = migrations
# Always overridden by the DATABASE_URL environment variable (see migrations/env.py).
# No real password here: the compose stack has no "postgres" password.
sqlalchemy.url = postgresql+psycopg://postgres:SET_DATABASE_URL@postgres:5432/analytics_poc

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
