[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-analytics-workspace"
version = "0.1.0"
description = "Schema-flexible agentic analytics workspace local POC"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.12.5",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "celery==5.4.0",
    "redis>=6.1.0",
    "duckdb==1.1.3",
    "sqlglot==26.0.0",
    "pyarrow==18.1.0",
    "openpyxl==3.1.5",
    "pymysql==1.1.1",
    "google-api-python-client>=2.156.0",
    "google-auth>=2.37.0",
    "google-cloud-bigquery>=3.27.0",
    "httpx>=0.28.1",
    "pyyaml==6.0.2",
    "cryptography>=44.0.0",
    "fpdf2==2.8.2",
    "python-docx==1.1.2",
    "deepagents>=0.7.35,<0.8.0",
    "langchain-core>=1.7.7,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-postgres>=3.2.1,<4.0.0",
    "opentelemetry-api>=1.29.0,<2.0.0",
    "opentelemetry-sdk>=1.29.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-timeout==2.4.0",
    "hypothesis==6.123.13",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/test_tool_loop.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["celery.*", "fpdf.*", "googleapiclient.*", "openpyxl.*", "pyarrow.*", "pymysql.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.jobs.celery_app", "app.jobs.tasks"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["app.adapters.connectors.sheets_connector", "app.adapters.connectors.bigquery_connector"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["app.api.main", "app.api.context", "app.api.routes.*", "app.api.run_service"]
warn_return_any = false

