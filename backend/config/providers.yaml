providers:
  - provider_id: openai
    api_profile: openai_responses
    endpoint_profile_id: openai_official_v1
    base_url: https://api.openai.com/v1
    default_timeout_seconds: 30
    max_concurrent_requests: 4
    allow_schema_egress: true
    allow_raw_record_egress: false

